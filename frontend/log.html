<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../assets/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailo</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    color: white;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url("../assets/idea1wallpaper.png");

}

.login-box{

    width:380px;

    padding:40px;

    border-radius:20px;

    border:1px solid #d8d8d8;

    background:#121821;

    box-shadow:0 15px 35px #A020F0;
}

.login-box h1{

    text-align:center;

    margin-bottom:35px;
}

form{

    display:flex;

    flex-direction:column;

    gap:20px;
}

input{

    padding:15px;

    border-radius:12px;

    border:1px solid #cfcfcf;
    color: black;
    outline:none;

    font-size:16px;
}

button{

    padding:15px;

    border:none;

    border-radius:12px;
    background-color: #A020F0;
    cursor:pointer;

    font-size:16px;
}

button:hover{
   background-color: #7b1fa2;
   transition: 0.3s;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">

            <h1>Iniciar sesión</h1>

            <form>
                <input type="text" placeholder="Usuario">
                <input type="password" placeholder="Contraseña">

                <button><a href="index.html">Ingresar</a></button>

            </form>



        </div>
    </div>
</body>
</html>
