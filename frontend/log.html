<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../assets/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailo</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    color: white;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url("../assets/idea1wallpaper.png");

}

.login-box{

    width:380px;

    padding:40px;

    border-radius:20px;

    border:1px solid #d8d8d8;

    background:#121821;

    box-shadow:0 15px 35px #A020F0;
}

.login-box h1{

    text-align:center;

    margin-bottom:35px;
}

form{

    display:flex;

    flex-direction:column;

    gap:20px;
}

input{

    padding:15px;

    border-radius:12px;

    border:1px solid #cfcfcf;
    color: black;
    outline:none;

    font-size:16px;
}

button{

    padding:15px;

    border:none;

    border-radius:12px;
    background-color: #A020F0;
    cursor:pointer;

    font-size:16px;
}

button:hover{
   background-color: #7b1fa2;
   transition: 0.3s;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">

            <h1>Iniciar sesión</h1>

            <form id="form-login">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>

                <button type="submit">Ingresar</button>
                <div style="text-align: center; margin-top: 15px; font-size: 13px;">
                    <a href="recuperar.html" style="color: #cfcfcf; text-decoration: none; transition: 0.3s;">
                        ¿Olvidaste tu contraseña? <span style="color: #A020F0; font-weight: bold;">Actualízala</span>
                    </a>
                </div>
                <p id="mensaje-error" style="color: #ff4d4d; text-align: center; font-size: 14px; display: none;"></p>
            </form>

            <div style="text-align: center; margin-top: 25px; font-size: 14px;">
                ¿Aún no tienes una cuenta? <a href="registro.html" style="color: #A020F0; text-decoration: none; font-weight: bold; transition: 0.3s;">Regístrate aquí</a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensajeError = document.getElementById('mensaje-error');

            mensajeError.style.display = 'none';

            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    localStorage.setItem('user_id', datos.user_id);
                    localStorage.setItem('session_id', datos.session_id);

                    window.location.href = "index.html";
                } else {
                    mensajeError.textContent = datos.detail || "Error al iniciar sesión.";
                    mensajeError.style.display = 'block';
                }
            } catch (error) {
                console.error("Error:", error);
                mensajeError.textContent = "Error conectando al servidor.";
                mensajeError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
