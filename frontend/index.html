<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo OTT - MVP</title>
    <link rel="icon" href="../assets/logo.png">
    <style>
        /* CSS original sin cambios */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-image: url("../assets/idea1wallpaper.png"); color: white; padding: 20px; }
        h1 { text-align: center; color: #A020F0; }
        .grid-peliculas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .tarjeta { background-color: #222; border-radius: 8px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex; flex-direction: column;}
        .tarjeta h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .categorias { font-size: 0.8rem; color: #aaa; margin-bottom: 15px; font-style: italic; flex-grow: 1;}
        .btn-descarga { width: 100%; padding: 10px; background: #A020F0; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .btn-descarga:hover { background: #7b1fa2; }
        video { width: 100%; aspect-ratio: 16/9; border-radius: 5px; background: black; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111114;
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .logo-seccion {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-seccion img {
            width: 42px;
            height: 42px;
        }
        .buscar {
            flex-grow: 1;         
            margin: 0 40px;      
            max-width: 600px;     
        }
        .buscar input {
            width: 100%;
            height: 42px;
            border: none;
            outline: none;
            border-radius: 25px;  
            padding: 0 25px;       
            background-color: white;
            color: black;
            font-size: 15px;
        }
        .logo-seccion h2 {
            margin: 0;
            color: white;
            font-size: 24px;
        }
        .botones-header {
            display: flex;
            flex-direction: column; /* Coloca uno debajo del otro */
            gap: 8px;              /* Espacio vertical entre ellos */
            width: 140px;          /* Ancho fijo para alinearlos perfectamente */
        }
        .btn-head {
            width: 100%;           /* Ocupan todo el ancho del contenedor */
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border: none;
            text-align: center;
            transition: 0.3s;
        }
        .btn-header-fav {
            background-color: #1c1c24;
            color: white;
            border: 1px solid #A020F0;
        }
        .btn-header-fav:hover {
            background-color: #A020F0;
        }
        .btn-header-salir {
            background-color: #A020F0;
            color: white;
        }
        .btn-header-salir:hover {
            background-color: #7b1fa2;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-seccion">
            <img src="../assets/logo.png" alt="Logo Trailo">
            <h2>Trailo</h2>
        </div>
        <div class="buscar">
            <input type="text" id="busco" placeholder="Que trailer deseas buscar...">
        </div>
        <div class="botones-header">
            <button class="btn-head btn-header-fav"><a href="favoritos.html">Favoritos</a></button>
            <a href="log.html" class="btn-head btn-header-salir">Cerrar sesión</a>
        </div>
    </header>

    <h1>Catálogo</h1>
    <div style="text-align: center;">
        <button onclick="cargarCatalogo()" class="btn-descarga" style="width: auto; padding: 10px 20px; font-size: 1rem;">
            Cargar Catálogo
        </button>
    </div>

    <div id="contenedor-peliculas" class="grid-peliculas"></div>

    <script>
        // Funciones corregidas con los puertos y rutas exactas
        function cargarCatalogo() {
            const contenedor = document.getElementById('contenedor-peliculas');
            contenedor.innerHTML = '<p style="text-align:center;">Conectando al servidor local...</p>';

            // CORRECCIÓN 1: Ruta completa con el puerto 8000 y el path correcto
            fetch('http://127.0.0.1:8000/api/catalogo')
                .then(respuesta => respuesta.json())
                .then(datos => {
                    contenedor.innerHTML = ''; 
                    
                    const primerasPeliculas = datos.datos.slice(0, 20);

                    primerasPeliculas.forEach(peli => {
                        // CORRECCIÓN 2: Uso correcto de template strings (backticks) y sintaxis de YouTube
                        const miniatura = `https://img.youtube.com/vi/${peli.trailer_key}/hqdefault.jpg`;

                        const tarjetaHTML = `
                            <div class="tarjeta" id="tarjeta-${peli.trailer_key}">
                                <h3>${peli.pelicula}</h3>
                                <div class="categorias">${peli.categorias}</div>
                                
                                <img src="${miniatura}" style="width: 100%; border-radius: 5px;" alt="Miniatura">
                                
                                <button onclick="descargarYReproducir('${peli.trailer_key}')" class="btn-descarga">
                                    ⬇️ Descargar y Reproducir
                                </button>
                                
                                <div id="reproductor-${peli.trailer_key}" style="margin-top: 10px; text-align: center;"></div>
                            </div>
                        `;
                        contenedor.innerHTML += tarjetaHTML;
                    });
                })
                .catch(err => {
                    contenedor.innerHTML = '<p style="color:red; text-align:center;">Error conectando al backend. Asegúrate de que Uvicorn esté encendido.</p>';
                    console.error(err);
                });
        }

        function descargarYReproducir(trailer_key) {
            const divReproductor = document.getElementById(`reproductor-${trailer_key}`);
            divReproductor.innerHTML = "<p style='font-size: 0.9rem; color: #ffeb3b;'>Conectando al servidor... ⏳</p>";

            // CORRECCIÓN 3: Ruta completa y template literal correcto
            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    if (datos.status === "ready") {
                        mostrarReproductor(trailer_key, datos.video_url);
                    } else if (datos.status === "downloading") {
                        divReproductor.innerHTML = "<p style='font-size: 0.9rem; color: #ffeb3b;'>Descargando (optimizado)... ⏳</p>";
                        
                        const intervalo = setInterval(() => {
                            // CORRECCIÓN 4: Ruta completa y template literal correcto para el sondeo (polling)
                            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                                .then(res => res.json())
                                .then(nuevoEstado => {
                                    if (nuevoEstado.status === "ready") {
                                        clearInterval(intervalo); 
                                        mostrarReproductor(trailer_key, nuevoEstado.video_url); 
                                    }
                                });
                        }, 3000);
                    }
                })
                .catch(err => {
                     divReproductor.innerHTML = "<p style='color:red;'>Error al intentar descargar.</p>";
                     console.error(err);
                });
        }

        function mostrarReproductor(trailer_key, url) {
            const divReproductor = document.getElementById(`reproductor-${trailer_key}`);
            divReproductor.innerHTML = `
                <video controls autoplay>
                    <source src="${url}" type="video/mp4">
                    Tu navegador no soporta video HTML5.
                </video>
            `;
        }
    </script>
</body>
</html>
