<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo OTT - MVP</title>
    <link rel="icon" href="../assets/logo.png">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-image: url("../assets/idea1wallpaper.png"); color: white; padding: 20px; }
        h1 { text-align: center; color: #A020F0; }
        
        .seccion-carrusel { margin-bottom: 40px; }
        .seccion-carrusel h2 {
            border-left: 5px solid #A020F0;
            padding-left: 10px;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .carrusel-contenedor {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .carrusel-contenedor::-webkit-scrollbar { height: 8px; }
        .carrusel-contenedor::-webkit-scrollbar-thumb { background: #A020F0; border-radius: 4px; }
        
        .tarjeta { 
            background-color: #222; 
            border-radius: 8px; 
            padding: 15px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column;
            flex: 0 0 300px;
        }
        
        .tarjeta h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .categorias { font-size: 0.8rem; color: #aaa; margin-bottom: 15px; font-style: italic; flex-grow: 1;}
        .btn-descarga { width: 100%; padding: 10px; background: #A020F0; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .btn-descarga:hover { background: #7b1fa2; }
        video { width: 100%; aspect-ratio: 16/9; border-radius: 5px; background: black; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: #111114; padding: 15px 30px; border-radius: 8px; margin-bottom: 20px;
        }
        .logo-seccion { display: flex; align-items: center; gap: 12px; }
        .logo-seccion img { width: 42px; height: 42px; }
        .buscar { flex-grow: 1; margin: 0 40px; max-width: 600px; }
        .buscar input { width: 100%; height: 42px; border: none; outline: none; border-radius: 25px; padding: 0 25px; background-color: white; color: black; font-size: 15px; }
        .logo-seccion h2 { margin: 0; color: white; font-size: 24px; }
        .botones-header { display: flex; flex-direction: column; gap: 8px; width: 140px; }
        .btn-head { width: 100%; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; border: none; text-align: center; transition: 0.3s; }
        .btn-header-fav { background-color: #1c1c24; color: white; border: 1px solid #A020F0; }
        .btn-header-fav:hover { background-color: #A020F0; }
        .btn-header-salir { background-color: #A020F0; color: white; }
        .btn-header-salir:hover { background-color: #7b1fa2; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-contenido {
            background: #111114;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            border: 1px solid #333;
        }

        .btn-cerrar-modal {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: 0.2s;
        }

        .btn-cerrar-modal:hover {
            background: #c2185b;
            transform: scale(1.1);
        }

        .acciones-modal {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-accion {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-like { background: #222; color: white; border: 1px solid #e91e63; }
        .btn-like:hover { background: #e91e63; }
        .btn-guardar { background: #222; color: white; border: 1px solid #4caf50; }
        .btn-guardar:hover { background: #4caf50; }
    </style>
</head>
<body>

    <header>
        <div class="logo-seccion">
            <img src="../assets/logo.png" alt="Logo Trailo">
            <h2>Trailo</h2>
        </div>
        <div class="buscar">
            <input type="text" id="busco" placeholder="Que trailer deseas buscar...">
        </div>
        <div class="botones-header">
            <a href="favoritos.html" class="btn-head btn-header-fav" style="text-decoration:none;">Mi Lista</a>
            <a href="log.html" class="btn-head btn-header-salir">Cerrar sesión</a>
        </div>
    </header>

    <h1>Inicio</h1>
    <div style="text-align: center;">
        <button onclick="cargarCarruseles(1)" class="btn-descarga" style="width: auto; padding: 10px 20px; font-size: 1rem;">
            Cargar Catálogo Personalizado
        </button>
    </div>
    <div id="modal-reproductor" class="modal-overlay">
        <div class="modal-contenido">
            <button class="btn-cerrar-modal" onclick="cerrarModal()">✕</button>
            
            <div id="espacio-video-modal" style="text-align: center; color: #ffeb3b; min-height: 200px; display: flex; align-items: center; justify-content: center;">
                Cargando...
            </div>
            
            <div id="acciones-modal" class="acciones-modal" style="display: none;">
            </div>
        </div>
    </div>
    <div id="contenedor-principal" style="margin-top: 30px;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userId = localStorage.getItem('user_id');
            
            if (!userId) {
                window.location.href = 'log.html';
                return; 
            }
            
            cargarCarruseles(userId);
        });
        
        function generarTarjetasHTML(listaPeliculas) {
            return listaPeliculas.map(peli => {
                const miniatura = `https://img.youtube.com/vi/${peli.trailer_link}/hqdefault.jpg`;
                const movieId = peli.movie_id; 

                return `
                    <div class="tarjeta">
                        <h3>${peli.nombre_pelicula || peli.pelicula}</h3>
                        <div class="categorias">${peli.categorias}</div>
                        
                        <img src="${miniatura}" onclick="abrirModalDescarga('${peli.trailer_link}', ${movieId})" style="width: 100%; border-radius: 5px; cursor: pointer; transition: 0.3s;" alt="Miniatura" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
                        
                    </div>
                `;
            }).join('');
        }

        function abrirModalDescarga(trailer_key, movieId) {
            const modal = document.getElementById('modal-reproductor');
            const espacioVideo = document.getElementById('espacio-video-modal');
            const accionesModal = document.getElementById('acciones-modal');
            
            modal.style.display = 'flex';
            espacioVideo.innerHTML = '<h3>Conectando al servidor... ⏳</h3>';
            accionesModal.style.display = 'none';

            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    if (datos.status === "ready") {
                        mostrarReproductorEnModal(datos.video_url, movieId);
                    } else if (datos.status === "downloading") {
                        espacioVideo.innerHTML = '<h3>Descargando contenido (optimizado)... ⏳</h3>';
                        
                        const intervalo = setInterval(() => {
                            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                                .then(res => res.json())
                                .then(nuevoEstado => {
                                    if (nuevoEstado.status === "ready") {
                                        clearInterval(intervalo); 
                                        mostrarReproductorEnModal(nuevoEstado.video_url, movieId); 
                                    }
                                });
                        }, 3000);
                    }
                })
                .catch(err => {
                    espacioVideo.innerHTML = "<h3 style='color:red;'>Error al intentar reproducir.</h3>";
                });
        }

        function mostrarReproductorEnModal(url, movieId) {
            const espacioVideo = document.getElementById('espacio-video-modal');
            const accionesModal = document.getElementById('acciones-modal');
            
            espacioVideo.innerHTML = `
                <video controls autoplay style="width: 100%; border-radius: 8px; aspect-ratio: 16/9; background: black;">
                    <source src="${url}" type="video/mp4">
                    Tu navegador no soporta video HTML5.
                </video>
            `;
            
            accionesModal.innerHTML = `
                <button onclick="darLike(${movieId})" id="btn-like-conteo" class="btn-accion btn-like">
                    ❤️ Me Gusta
                </button>
                <button onclick="guardarFavorito(${movieId})" id="btn-guardar-estado" class="btn-accion btn-guardar">
                    ⭐ Añadir a mi lista
                </button>
            `;

            accionesModal.style.display = 'flex';

            cargarEstadoLike(movieId);

            cargarEstadoGuardado(movieId);

            registrarProgreso(movieId);
        }

        function cargarEstadoLike(movieId) {
            const userId = localStorage.getItem('user_id');
            const btnLike = document.getElementById('btn-like-conteo');
            if (!btnLike) return;

            fetch(`http://127.0.0.1:8000/api/like/${movieId}?user_id=${userId || ''}`)
                .then(respuesta => respuesta.json())
                .then(datos => pintarBotonLike(datos.liked, datos.likes))
                .catch(err => console.error(err));
        }

        function pintarBotonLike(liked, totalLikes) {
            const btnLike = document.getElementById('btn-like-conteo');
            if (!btnLike) return;
            btnLike.textContent = `${liked ? '❤️' : '🤍'} Me Gusta (${totalLikes})`;
            btnLike.dataset.liked = liked;
        }

        function cargarEstadoGuardado(movieId) {
            const userId = localStorage.getItem('user_id');
            const btnGuardar = document.getElementById('btn-guardar-estado');
            if (!btnGuardar || !userId) return;

            fetch(`http://127.0.0.1:8000/api/guardar/${movieId}?user_id=${userId}`)
                .then(respuesta => respuesta.json())
                .then(datos => pintarBotonGuardar(datos.guardado))
                .catch(err => console.error(err));
        }

        function pintarBotonGuardar(guardado) {
            const btnGuardar = document.getElementById('btn-guardar-estado');
            if (!btnGuardar) return;
            btnGuardar.textContent = guardado ? '✅ En mi lista' : '⭐ Añadir a mi lista';
            btnGuardar.dataset.guardado = guardado;
        }

        function registrarProgreso(movieId) {
            const userId = localStorage.getItem('user_id');
            if (!userId) return;

            fetch(`http://127.0.0.1:8000/api/progreso/${movieId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: parseInt(userId) })
            }).catch(err => console.error(err));
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-reproductor');
            const espacioVideo = document.getElementById('espacio-video-modal');
            
            modal.style.display = 'none';
            espacioVideo.innerHTML = '';
        }

        function agregarSeccion(titulo, listaPeliculas, contenedorPadre) {
            if (!listaPeliculas || listaPeliculas.length === 0) return;

            const seccionHTML = `
                <div class="seccion-carrusel">
                    <h2>${titulo}</h2>
                    <div class="carrusel-contenedor">
                        ${generarTarjetasHTML(listaPeliculas)}
                    </div>
                </div>
            `;
            contenedorPadre.innerHTML += seccionHTML;
        }

        function cargarCarruseles(userId) {
            const contenedorPrincipal = document.getElementById('contenedor-principal');
            contenedorPrincipal.innerHTML = '<p style="text-align:center;">Analizando tus preferencias...</p>';

            fetch(`http://127.0.0.1:8000/api/carruseles/${userId}`)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    contenedorPrincipal.innerHTML = ''; 
                    
                    agregarSeccion('Seguir Viendo', datos.seguir_viendo, contenedorPrincipal);
                    agregarSeccion('Tendencias en tu País', datos.nacionales, contenedorPrincipal);
                    agregarSeccion('Tus Guardados', datos.guardados, contenedorPrincipal);
                    agregarSeccion('Recomendados para ti', datos.recomendados, contenedorPrincipal);
                })
                .catch(err => {
                    contenedorPrincipal.innerHTML = '<p style="color:red; text-align:center;">Error conectando al backend.</p>';
                    console.error(err);
                });
        }

        document.getElementById('busco').addEventListener('keyup', (evento) => {
            if (evento.key !== 'Enter') return;

            const texto = evento.target.value.trim();

            if (texto) {
                buscarPeliculas(texto);
            } else {
                const userId = localStorage.getItem('user_id');
                cargarCarruseles(userId);
            }
        });

        function buscarPeliculas(texto) {
            const contenedorPrincipal = document.getElementById('contenedor-principal');
            contenedorPrincipal.innerHTML = '<p style="text-align:center;">Buscando...</p>';

            fetch(`http://127.0.0.1:8000/api/catalogo?busqueda=${encodeURIComponent(texto)}`)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    contenedorPrincipal.innerHTML = '';

                    if (!datos.datos || datos.datos.length === 0) {
                        contenedorPrincipal.innerHTML = '<p style="text-align:center;">No encontramos películas con ese nombre.</p>';
                        return;
                    }

                    agregarSeccion(`Resultados para "${texto}"`, datos.datos, contenedorPrincipal);
                })
                .catch(err => {
                    contenedorPrincipal.innerHTML = '<p style="color:red; text-align:center;">Error conectando al backend.</p>';
                    console.error(err);
                });
        }

        function descargarYReproducir(trailer_key) {
            const divReproductor = document.getElementById(`reproductor-${trailer_key}`);
            divReproductor.innerHTML = "<p style='font-size: 0.9rem; color: #ffeb3b;'>Conectando al servidor... ⏳</p>";

            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    if (datos.status === "ready") {
                        mostrarReproductor(trailer_key, datos.video_url);
                    } else if (datos.status === "downloading") {
                        divReproductor.innerHTML = "<p style='font-size: 0.9rem; color: #ffeb3b;'>Descargando (optimizado)... ⏳</p>";
                        
                        const intervalo = setInterval(() => {
                            fetch(`http://127.0.0.1:8000/api/descargar/${trailer_key}`, { method: 'POST' })
                                .then(res => res.json())
                                .then(nuevoEstado => {
                                    if (nuevoEstado.status === "ready") {
                                        clearInterval(intervalo); 
                                        mostrarReproductor(trailer_key, nuevoEstado.video_url); 
                                    }
                                });
                        }, 3000);
                    }
                })
                .catch(err => {
                    divReproductor.innerHTML = "<p style='color:red;'>Error al intentar descargar.</p>";
                    console.error(err);
                });
        }
        function mostrarReproductor(trailer_key, url) {
            const divReproductor = document.getElementById(`reproductor-${trailer_key}`);
            divReproductor.innerHTML = `
                <video controls autoplay>
                    <source src="${url}" type="video/mp4">
                    Tu navegador no soporta video HTML5.
                </video>
            `;
            
            document.getElementById(`acciones-${trailer_key}`).style.display = 'flex';
        }

        function darLike(movieId) {
            const userId = localStorage.getItem('user_id');
            if (!userId) return alert("Debes iniciar sesión primero");

            fetch(`http://127.0.0.1:8000/api/like/${movieId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: parseInt(userId) })
            })
                .then(respuesta => respuesta.json())
                .then(datos => pintarBotonLike(datos.liked, datos.likes))
                .catch(err => {
                    console.error(err);
                    alert('No se pudo procesar el like.');
                });
        }

        function guardarFavorito(movieId) {
            const userId = localStorage.getItem('user_id');
            if (!userId) return alert("Debes iniciar sesión primero");

            fetch(`http://127.0.0.1:8000/api/guardar/${movieId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: parseInt(userId) })
            })
                .then(respuesta => respuesta.json())
                .then(datos => pintarBotonGuardar(datos.guardado))
                .catch(err => {
                    console.error(err);
                    alert('No se pudo actualizar tu lista.');
                });
        }
        
    </script>
</body>
</html>
